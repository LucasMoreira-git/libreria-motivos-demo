<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo | Librería Motivos</title>
  <style>
    :root {
      --primary: #d97786;
      --primary-dark: #c46372;
      --primary-light: #fef5f6;
      --purple-950: #2e1065;
      --slate-800: #1e293b;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --rose-dark: #6e2e38;
      --rose-border: #f4d0d6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafb linear-gradient(180deg, #ffffff 0%, #fefcfd 50%, #faf8fc 100%);
      padding: 1.5rem;
      color: var(--slate-800);
      position: relative;
      overflow: hidden;
    }
    .ambient-glow {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 208, 214, 0.25) 0%, rgba(222, 208, 242, 0.25) 50%, rgba(224, 231, 255, 0.15) 100%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }
    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-radius: 1.5rem;
      padding: 2.25rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px -15px rgba(46, 16, 101, 0.05), 0 1px 3px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--slate-200);
      text-align: center;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--primary-light);
      color: var(--rose-dark);
      border: 1px solid #f3cad2;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .logo-container {
      margin: 0 auto;
      width: 3.25rem;
      height: 3.25rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, #d97786, #b978b5 50%, #7e4f9e);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.35rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      border: 1px solid rgba(255,255,255,0.8);
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--purple-950);
      margin-top: 0.85rem;
      margin-bottom: 0.35rem;
      letter-spacing: -0.02em;
    }
    p.subtitle {
      color: var(--slate-500);
      font-size: 0.8125rem;
      margin-bottom: 1.75rem;
      line-height: 1.45;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
    }
    .form-group {
      margin-bottom: 1.15rem;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--slate-600);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.75rem;
      font-size: 0.9375rem;
      color: var(--slate-800);
      outline: none;
      transition: all 0.2s ease;
      background: #fafafa;
    }
    input:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(217, 119, 134, 0.18);
    }
    .toggle-pwd {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--slate-400);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
      transition: color 0.2s ease;
    }
    .toggle-pwd:hover {
      color: var(--slate-600);
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 0.75rem;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      box-shadow: 0 2px 8px rgba(217, 119, 134, 0.25);
    }
    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .alert-box {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.78125rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      background-color: var(--primary-light);
      color: var(--rose-dark);
      border: 1px solid var(--rose-border);
      text-align: left;
      line-height: 1.4;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    .footer-links {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--slate-100);
      font-size: 0.75rem;
      color: var(--slate-400);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-links a {
      color: var(--slate-500);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-links a:hover {
      color: var(--purple-950);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="login-card">
    <div class="brand-badge">Acceso Administrativo</div>
    <div class="logo-container">M</div>
    <h1>Librería Motivos</h1>
    <p class="subtitle">Gestioná el catálogo, las promociones y la información del local</p>

    <div id="alertBox" class="alert-box"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Usuario</label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" placeholder="admin" required autocomplete="username" oninput="ocultarAlerta()" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="current-password" oninput="ocultarAlerta()" />
          <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()" aria-label="Mostrar/ocultar contraseña">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span>Ingresar al Panel de Administración</span>
      </button>
    </form>

    <div class="footer-links">
      <a href="http://localhost:3000" target="_blank">← Vitrina Web</a>
      <span>Guaymallén, Mendoza</span>
    </div>
  </div>

  <script>
    // Redirección si ya hay token activo
    const existingToken = sessionStorage.getItem('motivos_admin_token');
    if (existingToken) {
      fetch('/api/admin/auth/validate', {
        method: 'POST',
        headers: { 'X-Admin-Token': existingToken }
      })
      .then(res => res.json())
      .then(data => {
        if (data.valido) {
          window.location.href = '/admin/panel.html';
        } else {
          sessionStorage.removeItem('motivos_admin_token');
        }
      })
      .catch(() => sessionStorage.removeItem('motivos_admin_token'));
    }

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>';
      } else {
        pwdInput.type = 'password';
        eyeIcon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    function ocultarAlerta() {
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Validando credenciales...</span>';

      try {
        const response = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value.trim()
          })
        });

        const data = await response.json();

        if (response.ok && data.autenticado) {
          sessionStorage.setItem('motivos_admin_token', data.token);
          sessionStorage.setItem('motivos_admin_user', data.username);
          sessionStorage.setItem('motivos_admin_nombre', data.nombre || data.username);
          window.location.href = '/admin/panel.html';
        } else {
          alertBox.innerText = 'No pudimos validar tus credenciales. Revisá los datos e intentá nuevamente.';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.innerText = 'No pudimos validar tus credenciales. Revisá los datos e intentá nuevamente.';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Ingresar al Panel de Administración</span>';
      }
    }
  </script>
</body>
</html>
