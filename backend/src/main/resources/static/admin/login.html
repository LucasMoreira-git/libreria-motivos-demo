<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo | Librería Motivos</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --primary-light: #ede9fe;
      --slate-800: #1e293b;
      --slate-600: #475569;
      --slate-400: #94a3b8;
      --slate-100: #f1f5f9;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fdf4f5 0%, #f5f3ff 50%, #eff6ff 100%);
      padding: 1.5rem;
      color: var(--slate-800);
    }
    .login-card {
      background: #ffffff;
      border-radius: 1.25rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px -15px rgba(139, 92, 246, 0.15), 0 0 1px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(226, 232, 240, 0.8);
      position: relative;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary-light);
      color: var(--primary-dark);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--slate-800);
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      color: var(--slate-600);
      font-size: 0.875rem;
      margin-bottom: 1.75rem;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--slate-600);
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.625rem;
      font-size: 0.9375rem;
      color: var(--slate-800);
      outline: none;
      transition: all 0.2s ease;
      background: #fafafa;
    }
    input:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
    }
    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      border: none;
      border-radius: 0.625rem;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .alert-box {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
      border: 1px solid transparent;
    }
    .alert-danger {
      background-color: var(--danger-bg);
      color: var(--danger);
      border-color: #fca5a5;
    }
    .footer-note {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--slate-400);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-badge">Librería Motivos</div>
    <h1>Panel de Administración</h1>
    <p class="subtitle">Ingresá tus credenciales configuradas en el sistema para acceder a la gestión interna.</p>

    <div id="alertBox" class="alert-box alert-danger"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Usuario Administrador</label>
        <input type="text" id="username" name="username" placeholder="admin" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span>Ingresar al Panel</span>
      </button>
    </form>

    <div class="footer-note">
      Sistema de Gestión • Guaymallén, Mendoza
    </div>
  </div>

  <script>
    // Si ya existe sesión válida previa, redirigir directo
    const existingToken = sessionStorage.getItem('motivos_admin_token');
    if (existingToken) {
      fetch('/api/admin/auth/validate', {
        method: 'POST',
        headers: { 'X-Admin-Token': existingToken }
      })
      .then(res => res.json())
      .then(data => {
        if (data.valido) {
          window.location.href = '/admin/panel.html';
        } else {
          sessionStorage.removeItem('motivos_admin_token');
        }
      })
      .catch(() => sessionStorage.removeItem('motivos_admin_token'));
    }

    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verificando...</span>';

      try {
        const response = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value.trim()
          })
        });

        const data = await response.json();

        if (response.ok && data.autenticado) {
          sessionStorage.setItem('motivos_admin_token', data.token);
          sessionStorage.setItem('motivos_admin_user', data.username);
          sessionStorage.setItem('motivos_admin_nombre', data.nombre || data.username);
          window.location.href = '/admin/panel.html';
        } else {
          alertBox.innerText = data.mensaje || 'Credenciales incorrectas. Verifique usuario y contraseña.';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.innerText = 'Error al comunicarse con el servidor. Verifique que el backend esté en ejecución.';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Ingresar al Panel</span>';
      }
    }
  </script>
</body>
</html>
