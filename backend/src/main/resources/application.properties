# ===================================================================
# Configuracion del Backend - Libreria Motivos
# ===================================================================
# Entorno limpio para produccion / demostracion publica
# Las credenciales sensibles deben suministrarse via variables de entorno.
# ===================================================================

server.port=${PORT:8080}

# Conexion a Base de Datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/libreriamotivosbd?useSSL=false&serverTimezone=America/Argentina/Mendoza}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
