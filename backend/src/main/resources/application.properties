# ===================================================================
# Configuración del Backend - Librería Motivos (Spring Boot 3)
# ===================================================================

server.port=${PORT:8080}

# ===================================================================
# Conexión a Base de Datos MySQL (XAMPP Puerto 3306)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/libreriamotivosbd?useSSL=false&serverTimezone=America/Argentina/Mendoza&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${LIBRERIA_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# Credenciales de Seguridad para el Apartado de ADMINISTRADOR
# ===================================================================
# Usuario y contraseña para autenticar accesos al panel administrativo.
# Modificable libremente o configurable vía variables de entorno.
# ===================================================================
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:motivosAdmin2026!}
app.admin.nombre=Administrador Librer\u00EDa Motivos

# ===================================================================
# Configuración de CORS para Frontend (Next.js)
# ===================================================================
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# ===================================================================
# Simulación y Precarga de Datos en Arranque
# ===================================================================
app.simulation.seed-on-startup=true
